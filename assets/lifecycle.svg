<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 280" width="1280" height="280" role="img" aria-label="Load lifecycle: post, quote, negotiate, dispatch, track, deliver, learn">
  <defs>
    <g id="truck">
      <rect x="0" y="-34" width="104" height="26" fill="#0a0c0f" stroke="#c9d1d9" stroke-width="1.4"/>
      <path d="M104 -11H108" stroke="#c9d1d9" stroke-width="1.4"/>
      <path d="M108 -8V-29H127L140 -18H147V-8Z" fill="#0a0c0f" stroke="#c9d1d9" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M129 -26L137 -18H129Z" fill="#30363d"/>
      <path d="M2 -8H147" stroke="#c9d1d9" stroke-width="1.4"/>
      <g fill="#0a0c0f" stroke="#c9d1d9" stroke-width="1.4">
        <circle cx="80" cy="-4" r="4"/><circle cx="91" cy="-4" r="4"/>
        <circle cx="113" cy="-4" r="4"/><circle cx="123" cy="-4" r="4"/>
        <circle cx="139" cy="-4" r="4"/>
      </g>
    </g>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif}
      .mono{font-family:"SF Mono","JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace}
      .run{animation:run 16s linear infinite}
      .progress{stroke-dasharray:1240 1240;animation:progress 16s linear infinite}
      .feed{stroke-dasharray:2 8;animation:feed 1.6s linear infinite}
      @keyframes run{from{transform:translateX(-62px)}to{transform:translateX(1178px)}}
      @keyframes progress{from{stroke-dashoffset:1240}to{stroke-dashoffset:0}}
      @keyframes feed{to{stroke-dashoffset:-20}}
    </style>
  </defs>

  <rect width="1280" height="280" rx="10" fill="#0a0c0f"/>
  <text class="mono" x="40" y="40" font-size="11" letter-spacing="3" fill="#6e7681">ONE LOAD, END TO END</text>

  <path d="M20 120H1260" stroke="#30363d" stroke-width="2"/>
  <path class="progress" d="M20 120H1260" stroke="#d29922" stroke-width="2"/>

  <g class="mono" text-anchor="middle">
    <g transform="translate(100 0)">
      <circle cy="120" r="6" fill="#0a0c0f" stroke="#8b949e" stroke-width="1.4"/>
      <text y="156" font-size="11" fill="#6e7681">01</text>
      <text class="sans" y="178" font-size="15" font-weight="600" letter-spacing="2" fill="#e6edf3">POST</text>
      <text y="198" font-size="10.5" fill="#8b949e">certified DAT integration</text>
      <text y="213" font-size="10.5" fill="#8b949e">managed while open</text>
    </g>
    <g transform="translate(280 0)">
      <circle cy="120" r="6" fill="#0a0c0f" stroke="#8b949e" stroke-width="1.4"/>
      <text y="156" font-size="11" fill="#6e7681">02</text>
      <text class="sans" y="178" font-size="15" font-weight="600" letter-spacing="2" fill="#e6edf3">QUOTE</text>
      <text y="198" font-size="10.5" fill="#8b949e">inbound carrier email</text>
      <text y="213" font-size="10.5" fill="#8b949e">load resolved, replied</text>
    </g>
    <g transform="translate(460 0)">
      <circle cy="120" r="6" fill="#0a0c0f" stroke="#8b949e" stroke-width="1.4"/>
      <text y="156" font-size="11" fill="#6e7681">03</text>
      <text class="sans" y="178" font-size="15" font-weight="600" letter-spacing="2" fill="#e6edf3">NEGOTIATE</text>
      <text y="198" font-size="10.5" fill="#8b949e">multi-turn by email</text>
      <text y="213" font-size="10.5" fill="#8b949e">inside broker limits</text>
    </g>
    <g transform="translate(640 0)">
      <circle cy="120" r="6" fill="#0a0c0f" stroke="#8b949e" stroke-width="1.4"/>
      <text y="156" font-size="11" fill="#6e7681">04</text>
      <text class="sans" y="178" font-size="15" font-weight="600" letter-spacing="2" fill="#e6edf3">DISPATCH</text>
      <text y="198" font-size="10.5" fill="#8b949e">rate con signed</text>
      <text y="213" font-size="10.5" fill="#8b949e">tracking thread opens</text>
    </g>
    <g transform="translate(820 0)">
      <circle cy="120" r="6" fill="#0a0c0f" stroke="#8b949e" stroke-width="1.4"/>
      <text y="156" font-size="11" fill="#6e7681">05</text>
      <text class="sans" y="178" font-size="15" font-weight="600" letter-spacing="2" fill="#e6edf3">TRACK</text>
      <text y="198" font-size="10.5" fill="#8b949e">voice, SMS, email</text>
      <text y="213" font-size="10.5" fill="#8b949e">FourKites GPS</text>
    </g>
    <g transform="translate(1000 0)">
      <circle cy="120" r="6" fill="#0a0c0f" stroke="#8b949e" stroke-width="1.4"/>
      <text y="156" font-size="11" fill="#6e7681">06</text>
      <text class="sans" y="178" font-size="15" font-weight="600" letter-spacing="2" fill="#e6edf3">DELIVER</text>
      <text y="198" font-size="10.5" fill="#8b949e">status into the TMS</text>
      <text y="213" font-size="10.5" fill="#8b949e">every attempt logged</text>
    </g>
    <g transform="translate(1180 0)">
      <circle cy="120" r="6" fill="#0a0c0f" stroke="#8b949e" stroke-width="1.4"/>
      <text y="156" font-size="11" fill="#6e7681">07</text>
      <text class="sans" y="178" font-size="15" font-weight="600" letter-spacing="2" fill="#e6edf3">LEARN</text>
      <text y="198" font-size="10.5" fill="#8b949e">every load to Postgres</text>
      <text y="213" font-size="10.5" fill="#8b949e">rates, carriers, lanes</text>
    </g>
  </g>

  <g transform="translate(0 116)">
    <g class="run"><g transform="scale(.56)"><use href="#truck"/></g></g>
  </g>

  <g class="mono" font-size="10.5" letter-spacing="2">
    <path class="feed" d="M40 250H1240" stroke="#3d444d" stroke-width="1.2"/>
    <rect x="40" y="241" width="430" height="18" fill="#0a0c0f"/>
    <text xml:space="preserve" x="40" y="254" fill="#6e7681">MARKET DATA  <tspan fill="#8b949e" letter-spacing="0.5">DAT every 15 minutes, our own ZIP3 markets</tspan></text>
  </g>
</svg>
