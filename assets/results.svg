<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 220" width="1280" height="220" role="img" aria-label="Results: $29,811 verified below the rate ceiling across 223 loads, $134 average per load, 1,295 loads distributed to DAT">
  <defs>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif}
      .mono{font-family:"SF Mono","JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace}
    </style>
  </defs>

  <rect width="1280" height="220" rx="10" fill="#0a0c0f"/>
  <text class="mono" xml:space="preserve" x="40" y="40" font-size="11" letter-spacing="3" fill="#6e7681">RESULTS   ONE POD   2026</text>

  <g stroke="#30363d"><path d="M320 70V180M640 70V180M960 70V180"/></g>

  <g transform="translate(40 0)">
    <text class="sans" y="118" font-size="46" font-weight="600" fill="#e6edf3">$29,811</text>
    <path class="bar" d="M0 136H48" stroke="#d29922" stroke-width="2"/>
    <text class="mono" y="160" font-size="11" fill="#8b949e">paid below the rate ceiling,</text>
    <text class="mono" y="176" font-size="11" fill="#8b949e">verified against the TMS</text>
  </g>
  <g transform="translate(360 0)">
    <text class="sans" y="118" font-size="46" font-weight="600" fill="#e6edf3">223</text>
    <path class="bar" d="M0 136H48" stroke="#d29922" stroke-width="2" style="animation-delay:.15s"/>
    <text class="mono" y="160" font-size="11" fill="#8b949e">loads negotiated by the agent</text>
    <text class="mono" y="176" font-size="11" fill="#8b949e">and run with that carrier</text>
  </g>
  <g transform="translate(680 0)">
    <text class="sans" y="118" font-size="46" font-weight="600" fill="#e6edf3">$134</text>
    <path class="bar" d="M0 136H48" stroke="#d29922" stroke-width="2" style="animation-delay:.3s"/>
    <text class="mono" y="160" font-size="11" fill="#8b949e">average under ceiling per load,</text>
    <text class="mono" y="176" font-size="11" fill="#8b949e">vs $20 over on loads booked outside it</text>
  </g>
  <g transform="translate(1000 0)">
    <text class="sans" y="118" font-size="46" font-weight="600" fill="#e6edf3">1,295</text>
    <path class="bar" d="M0 136H48" stroke="#d29922" stroke-width="2" style="animation-delay:.45s"/>
    <text class="mono" y="160" font-size="11" fill="#8b949e">loads distributed to the</text>
    <text class="mono" y="176" font-size="11" fill="#8b949e">DAT board, 2,139 postings</text>
  </g>
</svg>
